<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title></title>
  <link rel="icon" href="data:,">
  <style>
    /* All styles are scoped to this player card to avoid affecting WordPress theme menus. */
    .clapper-player-card {
      display: block;
      width: min(100%, 960px);
      margin: 20px auto;
      overflow: hidden;
      border: 1px solid #2b2b2b;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
      isolation: isolate;
    }
    .clapper-player-card__screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      overflow: hidden;
      background: #000;
    }
    .clapper-player-card__screen > div,
    .clapper-player-card__screen video,
    .clapper-player-card__screen .media-control {
      max-width: 100%;
    }
    @media (max-width: 480px) {
      .clapper-player-card {
        margin: 12px auto;
        border-radius: 10px;
      }
      .clapper-player-card__screen { min-height: 180px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cdnbye@latest/dist/hlsjs-p2p-engine.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cdnbye@latest/dist/clappr-plugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/clappr/clappr-level-selector-plugin@latest/dist/level-selector.min.js"></script>
</head>
<body>
  <div class="clapper-player-card">
    <div class="clapper-player-card__screen" id="clapper-player-screen" aria-label="Video player"></div>
  </div>
  <script>
    (() => {
      "use strict";
      const DEFAULT_SOURCE = "https://cinexcricket.com/proxy/universal.php/?url=https%3A%2F%2Fdai-fancode.pages.dev%2Fmumbai%2F4250358_english_hls_96367dc67f52533_1ta-di_h264%2Findex.m3u8";
      const query = new URLSearchParams(window.location.search);
      const source = (query.get("src") || DEFAULT_SOURCE).trim();
      const parent = document.getElementById("clapper-player-screen");

      function initClapperCard() {
        if (!window.Clappr || typeof window.Clappr.Player !== "function") {
          console.error("Clappr player library did not load.");
          return;
        }
        const plugins = [];
        if (window.CDNByeClapprPlugin) plugins.push(window.CDNByeClapprPlugin);
        if (window.LevelSelector) plugins.push(window.LevelSelector);

        const config = {
          source,
          mimeType: "application/x-mpegURL",
          parent,
          width: "100%",
          height: "100%",
          autoPlay: true,
          mute: true,
          playback: {
            hlsjsConfig: {
              enableWorker: true,
              ...(window.HlsJsP2PEngine ? {
                p2pConfig: { logLevel: "warn", live: true }
              } : {})
            }
          }
        };
        if (plugins.length) config.plugins = plugins;
        if (window.LevelSelector) config.levelSelectorConfig = {
          title: "Quality",
          labels: { 0: "Auto" }
        };
        try {
          new window.Clappr.Player(config);
        } catch (error) {
          console.error("Player initialization failed:", error);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initClapperCard, { once: true });
      } else {
        initClapperCard();
      }
    })();
  </script>
</body>
</html>
